components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 180
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AppointmentStatusEnum'
        location:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        lead:
          type: integer
          nullable: true
        customer:
          type: integer
          nullable: true
        assigned_to:
          type: integer
          nullable: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - ends_at
      - id
      - starts_at
      - title
      - updated_at
    AppointmentStatusEnum:
      enum:
      - SCHEDULED
      - COMPLETED
      - CANCELLED
      - NO_SHOW
      type: string
      description: |-
        * `SCHEDULED` - Scheduled
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
        * `NO_SHOW` - No show
    ChannelEnum:
      enum:
      - WEBSITE
      - WHATSAPP
      - INSTAGRAM
      - EMAIL
      - PHONE
      - OTHER
      type: string
      description: |-
        * `WEBSITE` - Website
        * `WHATSAPP` - WhatsApp
        * `INSTAGRAM` - Instagram
        * `EMAIL` - Email
        * `PHONE` - Phone
        * `OTHER` - Other
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        status:
          $ref: '#/components/schemas/ConversationStatusEnum'
        subject:
          type: string
          maxLength: 200
        external_contact:
          type: string
          maxLength: 180
        started_at:
          type: string
          format: date-time
          readOnly: true
        last_message_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        lead:
          type: integer
          nullable: true
        customer:
          type: integer
          nullable: true
        assigned_to:
          type: integer
          nullable: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - id
      - last_message_at
      - started_at
      - updated_at
    ConversationStatusEnum:
      enum:
      - OPEN
      - WAITING
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Open
        * `WAITING` - Waiting
        * `CLOSED` - Closed
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assigned_to_username:
